server:
  host: 127.0.0.1
  port: 8848

llm:
  # provider: claude-cli | siliconflow | openrouter | deepseek | anthropic | openai-compat
  #   siliconflow   默认：硅基流动，国内直连，base_url 已内置
  #   claude-cli    复用本机 claude 命令，零配置零额外成本
  #   openrouter    模型例 deepseek/deepseek-v4-flash，reasoning: false 关掉深度思考
  #   deepseek      deepseek 官方 API
  #   openai-compat 其它 OpenAI 兼容服务（智谱 / Ollama / vLLM…），必须填 base_url
  provider: siliconflow
  model: "deepseek-ai/DeepSeek-V3"      # 硅基流动的模型 id 带前缀，按官方文档填
  vision_model: ""       # 图片解析用的多模态模型；留空则退回本机 claude 命令
  base_url: ""           # 留空用 provider 的默认地址；openai-compat 必填
  api_key: ""            # 留空则读 SILICONFLOW_API_KEY / OPENROUTER_API_KEY / DEEPSEEK_API_KEY / DDLHUB_API_KEY
  timeout_seconds: 240
  batch_size: 60
  temperature: 0
  max_tokens: 4096
  reasoning: false       # openrouter 专用：false=不走深度思考
  # 换配置不用手改：python -m ddlhub.setup_llm

# 网络错误重试：所有同步 HTTP 调用共用；没写的键用 ddlhub/net.py 的默认值
retry:
  enabled: true
  max_attempts: 3          # 总尝试次数（含第一次）；1 = 不重试
  initial_delay: 1.0       # 首次退避秒数，之后 ×multiplier
  max_delay: 20            # 单次退避上限
  multiplier: 2.0
  jitter: 0.3              # ±30% 抖动，避免多路同时重试
  retry_statuses: [408, 429, 500, 502, 503, 504]
  honor_retry_after: true  # 429/503 带 Retry-After 时按服务端要求等待
  max_retry_after: 60      # Retry-After 超过这个值就放弃，不干等
  # 可选：按子系统覆盖上面的键（llm / notify / sources / attach / intake）
  # llm:
  #   max_attempts: 2

notify:
  daily_time: "08:00"      # 每天几点跑抽取+推送
  digest_hours: 72         # 摘要里列出未来多少小时内的任务（72=三天，与看板一致）
  telegram:
    enabled: false
    token: ""              # 找 @BotFather 建机器人拿 token
    chat_id: ""            # 你的 Telegram user id

intake:
  # 手动录入：向 bot 发 /add_homework，再发作业消息/截图，/done 解析入看板。
  # 默认复用上面 notify 的 bot（它只发消息、不拉更新，槽位是空的）。
  enabled: false
  token: ""                     # 留空=复用 notify.telegram.token
  session_timeout_minutes: 30   # 录入会话多久没动静就作废
  allowed_chat_ids: []          # 留空=只接受 notify.telegram.chat_id

sources:
  yuketang:
    enabled: false
    host: "www.yuketang.cn"   # 学校有独立入口就换成 xxx.yuketang.cn
    cookie: ""                # 浏览器登录后复制含 sessionid 的整条 Cookie
  qq:
    enabled: false
    mode: napcat
    onebot_http: "http://127.0.0.1:3000"
    token: ""
    groups: []                # 只收这些群，留空=全部
  wechat:
    enabled: false
    mode: wxauto              # manual | wxauto（wxauto 需要微信 3.9.x）
    groups: []                # 要读取的群名，和微信会话列表里显示的完全一致
  zhihuishu:
    enabled: false
    cookie: ""                # 浏览器登录智慧树后复制整条 Cookie
    # 加密常量，只有站点改版才需要覆盖；留空用内置值
    home_key: ""
    ai_key: ""
    iv: ""
